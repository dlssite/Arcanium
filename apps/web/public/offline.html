<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Arcanium</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #120E18 0%, #1A1423 100%);
      color: #F1ECF7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 420px;
    }

    .icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      opacity: 0.7;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #F1ECF7;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #9E94AB;
      margin-bottom: 32px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button, a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #FFDE88;
      color: #120E18;
    }

    .btn-primary:hover {
      background: #FFE99B;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 222, 136, 0.1);
      color: #FFDE88;
      border: 1px solid rgba(255, 222, 136, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(255, 222, 136, 0.15);
    }

    .status {
      margin-top: 24px;
      font-size: 13px;
      color: #6B5D80;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #DE9B35;
      opacity: 0.6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      animation: fadeIn 0.4s ease-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#9E94AB" opacity="0.3"/>
      <path d="M1 9l2 2c2.88-2.88 6.79-4.08 10.53-3.62l1.19-2.68C9.89 3.84 4.74 5.27 1 9zm8 8l3 3 3-3a4.237 4.237 0 00-6 0zm-4-4l2 2a7.074 7.074 0 018 0l2-2C15.14 10.14 8.86 10.14 5 13z" fill="#FFDE88"/>
    </svg>

    <h1>You're offline</h1>
    <p>It looks like you've lost your internet connection. Check your network settings and try again.</p>

    <div class="actions">
      <button class="btn-primary" onclick="window.location.reload()">
        Try again
      </button>
      <a href="/" class="btn-secondary">
        Go to home
      </a>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      <span>No internet connection</span>
    </div>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
